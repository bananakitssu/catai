name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Install CatAI
        run: python -m pip install -e .
      - name: Run tests
        run: python -m pytest -q

  generate:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CatAI
        run: python -m pip install -e .
      - name: Generate training corpus
        run: python data/generate_corpus.py --sentences 100000 --output data/generated.txt
      - name: Train model
        run: |
          python -m catai \
            --corpus data/generated.txt \
            --checkpoint catai.pt \
            --epochs 1 \
            --batch-size 32 \
            --sequence-length 64 \
            --d-model 32 \
            --heads 4 \
            --layers 2 \
            --device cpu
      - name: Generate text
        run: |
          python -m catai.generate_cli \
            --checkpoint catai.pt \
            --prompt "The cat" \
            --max-new-tokens 200 \
            --temperature 0.8 \
            --repetition-penalty 1.1 \
            --device cpu
