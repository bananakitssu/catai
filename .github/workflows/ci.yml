name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Install CatAI
        run: python -m pip install -e .
      - name: Run tests
        run: python -m pytest -q

  generate:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install CatAI
        run: python -m pip install -e .
      - name: Restore corpus cache
        id: corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: data/corpus.txt
          key: catai-corpus-redpajama-v2-100m-${{ hashFiles('data/download_corpus.py') }}
      - name: Download real text corpus
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        run: python data/download_corpus.py --output data/corpus.txt --target-chars 100000000
      - name: Save corpus cache
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/corpus.txt
          key: catai-corpus-redpajama-v2-50docs-100m-${{ hashFiles('data/download_corpus.py') }}
      - name: Train base model
        run: |
          python -m catai \
            --corpus data/corpus.txt \
            --checkpoint catai.pt \
            --epochs 1 \
            --batch-size 16 \
            --sequence-length 256 \
            --model-size base \
            --max-tokens 10000000 \
            --validation-split 0.05 \
            --device cpu
      - name: Generate text
        run: |
          python -m catai.generate_cli \
            --checkpoint catai.pt \
            --prompt "The cat" \
            --max-new-tokens 200 \
            --temperature 0.7 \
            --top-k 40 \
            --repetition-penalty 1.1 \
            --no-repeat-ngram-size 3 \
            --device cpu
