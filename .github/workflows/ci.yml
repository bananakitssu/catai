name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      chat_examples:
        description: "Maximum combined OASST1 + OASST2 chat examples for SFT"
        required: false
        default: "10000"
      sft_epochs:
        description: "SFT epochs"
        required: false
        default: "3"
      base_epochs:
        description: "Base-model pretraining epochs"
        required: false
        default: "1"
      tokenizer:
        description: "Tokenizer for a fresh base-model experiment"
        type: choice
        options:
          - bpe
          - char
        required: true
        default: bpe
      sequence_length:
        description: "Base and SFT sequence length (default 1024; use 512 for faster/lower-memory experiments)"
        type: choice
        options:
          - "512"
          - "1024"
        required: true
        default: "1024"
      max_tokens:
        description: "Base pretraining token budget; default is 200M tokens for tiny"
        required: false
        default: "200000000"
      model_size:
        description: "Model preset; larger presets require proportionally more tokens"
        type: choice
        options:
          - tiny
          - small
          - base
          - medium
        required: true
        default: tiny
      publish_model:
        description: "Publish this experiment to the live B2 model manifest"
        type: boolean
        required: true
        default: false
      training_mode:
        description: "Run tests, full retraining, SFT-only, emotion-data, or expanded dataset preparation"
        type: choice
        options:
          - tests_only
          - full
          - sft_only
          - emotions_only
          - datasets_only
        required: true
        default: full
      base_checkpoint_run_id:
        description: "For sft_only: Actions run ID containing the catai-base-checkpoint artifact"
        required: false
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PIP_NO_CACHE_DIR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest 'boto3>=1.34,<2'
      - name: Disk usage before CatAI install
        run: |
          echo "=== Filesystem ==="
          df -h /
          echo
          echo "=== Relevant directories ==="
          du -sh "$HOME" "$GITHUB_WORKSPACE" "$RUNNER_TOOL_CACHE" "$RUNNER_TEMP" /tmp 2>/dev/null || true
          echo
          echo "=== pip cache ==="
          du -sh "$HOME/.cache/pip" 2>/dev/null || true
      - name: Install CatAI
        run: python -m pip install -e .
      - name: Disk usage after CatAI install
        run: |
          echo "=== Filesystem ==="
          df -h /
          echo
          echo "=== Relevant directories ==="
          du -sh "$HOME" "$GITHUB_WORKSPACE" "$RUNNER_TOOL_CACHE" "$RUNNER_TEMP" /tmp 2>/dev/null || true
          echo
          echo "=== pip cache ==="
          du -sh "$HOME/.cache/pip" 2>/dev/null || true
      - name: Validate training inputs
        if: github.event_name == 'workflow_dispatch'
        env:
          BASE_EPOCHS: ${{ inputs.base_epochs || '1' }}
          SFT_EPOCHS: ${{ inputs.sft_epochs || '1' }}
          CHAT_EXAMPLES: ${{ inputs.chat_examples || '10000' }}
          MAX_TOKENS: ${{ inputs.max_tokens || '200000000' }}
          MODEL_SIZE: ${{ inputs.model_size || 'tiny' }}
          TRAINING_MODE: ${{ inputs.training_mode || 'full' }}
          TOKENIZER: ${{ inputs.tokenizer || 'bpe' }}
          SEQUENCE_LENGTH: ${{ inputs.sequence_length || '1024' }}
        run: |
          python - <<'PY'
          import os

          def positive_int(name, maximum):
              value = os.environ[name]
              if not value.isdecimal():
                  raise SystemExit(f"{name} must be a positive integer")
              number = int(value)
              if number < 1 or number > maximum:
                  raise SystemExit(f"{name} must be between 1 and {maximum}")
              return number

          positive_int("BASE_EPOCHS", 5)
          positive_int("SFT_EPOCHS", 10)
          positive_int("CHAT_EXAMPLES", 50000)
          if os.environ["TRAINING_MODE"] == "full":
              max_tokens = positive_int("MAX_TOKENS", 2500000000)
              parameter_counts = {"tiny": 918656, "small": 6557952, "base": 38810112, "medium": 113664768}
              model_size = os.environ["MODEL_SIZE"]
              if model_size not in parameter_counts:
                  raise SystemExit("MODEL_SIZE must be tiny, small, base, or medium")
              tokens_per_parameter = max_tokens / parameter_counts[model_size]
              if tokens_per_parameter < 21.1:
                  raise SystemExit(
                      f"{model_size} has {parameter_counts[model_size]:,} parameters; "
                      f"{max_tokens:,} tokens is only {tokens_per_parameter:.1f} tokens/parameter. "
                      "With a 5% validation split, use at least 21.1 input tokens/parameter to retain 20 training tokens/parameter."
                  )
              print(f"Training budget: {model_size}, {max_tokens:,} tokens, {tokens_per_parameter:.1f} tokens/parameter.")
          if os.environ["TOKENIZER"] not in {"bpe", "char"}:
              raise SystemExit("TOKENIZER must be 'bpe' or 'char'")
          if os.environ["SEQUENCE_LENGTH"] not in {"512", "1024"}:
              raise SystemExit("SEQUENCE_LENGTH must be 512 or 1024")
          if os.environ["TOKENIZER"] == "char" and os.environ["SEQUENCE_LENGTH"] != "1024":
              raise SystemExit(
                  "The character tokenizer needs a 1024-token context for CatAI's "
                  "state prompt; use BPE for the 512-token experiment."
              )
          print("Experiment inputs validated.")
          PY
      - name: Compile CatAI Python sources
        run: python -m compileall -q inference scripts data src tests

      - name: Run tests with disk monitor
        shell: bash
        run: |
          set -o pipefail

          python -m pytest -q &
          test_pid=$!

          (
            while kill -0 "$test_pid" 2>/dev/null; do
              echo
              echo "=== Disk monitor $(date -u '+%Y-%m-%d %H:%M:%S UTC') ==="
              df -h /
              echo "--- selected directories ---"
              du -sh /tmp "$HOME" "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$RUNNER_TOOL_CACHE" 2>/dev/null || true
              sleep 30
            done
          ) &
          monitor_pid=$!

          wait "$test_pid"
          test_status=$?

          kill "$monitor_pid" 2>/dev/null || true
          wait "$monitor_pid" 2>/dev/null || true

          exit "$test_status"

  base_training:
    if: github.event_name == 'workflow_dispatch' && inputs.training_mode == 'full'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Verify B2 publisher secrets before expensive training
        if: inputs.publish_model == true
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_ENDPOINT_URL: ${{ secrets.B2_ENDPOINT_URL }}
          B2_REGION: ${{ secrets.B2_REGION }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in B2_KEY_ID B2_APPLICATION_KEY B2_BUCKET_NAME B2_ENDPOINT_URL B2_REGION; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing GitHub Actions secrets: %s\n' "${missing[*]}" >&2
            echo 'Add the B2 secrets listed in inference/README.md before starting a full training run.' >&2
            exit 1
          fi
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit

          endpoint = os.environ["B2_ENDPOINT_URL"].strip().strip(chr(34) + chr(39))
          if "://" not in endpoint:
              endpoint = "https://" + endpoint
          parsed = urlsplit(endpoint)
          if (
              parsed.scheme.lower() != "https"
              or not parsed.hostname
              or parsed.username
              or parsed.password
              or parsed.query
              or parsed.fragment
              or parsed.path not in ("", "/")
          ):
              raise SystemExit(
                  "Invalid B2_ENDPOINT_URL secret. Set it to the HTTPS S3 API base URL, "
                  "for example https://s3.us-east-005.backblazeb2.com. "
                  "The configured value was not printed."
              )
          print("B2 endpoint format validated (value hidden).")
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Disk usage before CatAI install
        run: |
          echo "=== Filesystem ==="
          df -h /
          echo
          echo "=== Relevant directories ==="
          du -sh "$HOME" "$GITHUB_WORKSPACE" "$RUNNER_TOOL_CACHE" "$RUNNER_TEMP" 2>/dev/null || true
          echo
          echo "=== pip cache ==="
          du -sh "$HOME/.cache/pip" 2>/dev/null || true
      - name: Install CatAI and corpus tooling
        run: python -m pip install -e ".[data]"
      - name: Disk usage after CatAI install
        run: |
          echo "=== Filesystem ==="
          df -h /
          echo
          echo "=== Relevant directories ==="
          du -sh "$HOME" "$GITHUB_WORKSPACE" "$RUNNER_TOOL_CACHE" "$RUNNER_TEMP" 2>/dev/null || true
          echo
          echo "=== pip cache ==="
          du -sh "$HOME/.cache/pip" 2>/dev/null || true

      - name: Check reused checkpoint settings
        if: inputs.training_mode == 'sft_only'
        env:
          EXPECTED_TOKENIZER: ${{ inputs.tokenizer }}
          EXPECTED_SEQUENCE_LENGTH: ${{ inputs.sequence_length }}
        run: |
          python - <<'PY'
          import os
          from catai.checkpoint import load_checkpoint_metadata

          metadata = load_checkpoint_metadata("catai.pt")
          tokenizer = metadata.get("tokenizer", {})
          model = metadata.get("model", {})
          expected_tokenizer = os.environ["EXPECTED_TOKENIZER"]
          expected_length = int(os.environ["EXPECTED_SEQUENCE_LENGTH"])

          if tokenizer.get("type") != expected_tokenizer:
              raise SystemExit(
                  f"Selected base checkpoint uses tokenizer={tokenizer.get('type')!r}; "
                  f"the workflow requested {expected_tokenizer!r}."
              )
          if model.get("max_seq_len") != expected_length:
              raise SystemExit(
                  f"Selected base checkpoint uses context length={model.get('max_seq_len')!r}; "
                  f"the workflow requested {expected_length}."
              )
          print("Reused checkpoint tokenizer and context match the selected experiment.")
          PY
      - name: Restore OASST1 source cache
        id: oasst-cache
        uses: actions/cache/restore@v4
        with:
          path: data/oasst1_ready.trees.jsonl.gz
          key: catai-oasst1-ready-v1
      - name: Build OASST1 CatAI chat dataset
        run: |
          python data/download_oasst1.py \
            --source data/oasst1_ready.trees.jsonl.gz \
            --output data/oasst1_chat.jsonl \
            --language en \
            --min-assistant-chars 20 \
            --max-assistant-rank 1 \
            --max-depth 4 \
            --keep-source
      - name: Restore OASST2 source cache
        id: oasst2-cache
        uses: actions/cache/restore@v4
        with:
          path: data/oasst2_ready.trees.jsonl.gz
          key: catai-oasst2-ready-v1
      - name: Build OASST2 CatAI chat dataset
        run: |
          python data/download_oasst2.py \
            --source data/oasst2_ready.trees.jsonl.gz \
            --output data/oasst2_chat.jsonl \
            --language en \
            --min-assistant-chars 20 \
            --max-assistant-rank 1 \
            --max-depth 4 \
            --keep-source
      - name: Save OASST2 source cache
        if: steps.oasst2-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/oasst2_ready.trees.jsonl.gz
          key: catai-oasst2-ready-v1
      - name: Merge and balance OASST1 + OASST2
        env:
          CHAT_EXAMPLES: ${{ inputs.chat_examples || '10000' }}
        run: |
          python data/merge_chat_datasets.py \
            --oasst1 data/oasst1_chat.jsonl \
            --oasst2 data/oasst2_chat.jsonl \
            --output data/oasst_chat.jsonl \
            --max-examples "$CHAT_EXAMPLES" \
            --seed 42

      - name: Validate OASST1 and CatAI personality datasets
        run: |
          python - <<'PY'
          from catai.chat_dataset import load_chat_dataset
          from catai.sft import ChatSupervisedDataset
          from catai.tokenizer import CharTokenizer

          base_examples = load_chat_dataset("data/oasst_chat.jsonl")
          personality_examples = load_chat_dataset("data/instruction_chat.jsonl")
          examples = base_examples + personality_examples
          dataset = ChatSupervisedDataset(
              examples,
              CharTokenizer.default(),
              sequence_length=1024,
          )
          print(f"validated {len(base_examples):,} merged OpenAssistant examples")
          print(f"validated {len(personality_examples):,} personality examples")
          print(f"preflight constructed {len(dataset):,} SFT examples")
          PY

      - name: Save OASST1 source cache
        if: steps.oasst-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/oasst1_ready.trees.jsonl.gz
          key: catai-oasst1-ready-v1

      - name: Restore corpus cache
        id: corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: data/corpus.txt
          key: catai-corpus-curated-v3-${{ hashFiles('data/download_corpus.py') }}
      - name: Download real text corpus
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        run: python data/download_corpus.py --output data/corpus.txt --target-chars 1000000000 --fineweb-edu-chars 150000000
      - name: Save corpus cache
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/corpus.txt
          key: catai-corpus-curated-v3-${{ hashFiles('data/download_corpus.py') }}

      - name: Train base model (quarter 1 of 4)
        env:
          BASE_EPOCHS: ${{ inputs.base_epochs || '1' }}
          TOKENIZER: ${{ inputs.tokenizer || 'bpe' }}
          SEQUENCE_LENGTH: ${{ inputs.sequence_length || '1024' }}
          MAX_TOKENS: ${{ inputs.max_tokens || '200000000' }}
          MODEL_SIZE: ${{ inputs.model_size || 'tiny' }}
        run: |
          # At 1024 context, reduce batch size to keep the attention activation
          # footprint near the previous 16 x 512 configuration.
          if [[ "$SEQUENCE_LENGTH" == "1024" ]]; then
            BASE_BATCH_SIZE=4
          else
            BASE_BATCH_SIZE=16
          fi
          python -m catai \
            --corpus data/corpus.txt \
            --checkpoint catai.pt \
            --epochs "$BASE_EPOCHS" \
            --batch-size "$BASE_BATCH_SIZE" \
            --sequence-length "$SEQUENCE_LENGTH" \
            --model-size "$MODEL_SIZE" \
            --tokenizer "$TOKENIZER" \
            --vocab-size 512 \
            --tokenizer-sample-chars 250000 \
            --max-tokens "$MAX_TOKENS" \
            --validation-split 0.05 \
            --minimum-tokens-per-parameter 20 \
            --device cpu \
            --recovery-checkpoint catai-base-recovery.pt \
            --checkpoint-every-batches 50 \
            --max-batches-per-run-fraction 0.25

      - name: Upload base training recovery checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: catai-base-recovery
          path: catai-base-recovery.pt
          retention-days: 7

  base_training2:
    if: github.event_name == 'workflow_dispatch' && inputs.training_mode == 'full'
    needs: [test, base_training]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install CatAI and corpus tooling
        run: python -m pip install -e ".[data]"
      - name: Restore corpus cache
        id: corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: data/corpus.txt
          key: catai-corpus-curated-v3-${{ hashFiles('data/download_corpus.py') }}
      - name: Download real text corpus
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        run: python data/download_corpus.py --output data/corpus.txt --target-chars 1000000000 --fineweb-edu-chars 150000000
      - name: Save corpus cache
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/corpus.txt
          key: catai-corpus-curated-v3-${{ hashFiles('data/download_corpus.py') }}
      - name: Download base training recovery checkpoint
        uses: actions/download-artifact@v4
        with:
          name: catai-base-recovery
          path: .
      - name: Resume base training (quarter 2 of 4)
        env:
          BASE_EPOCHS: ${{ inputs.base_epochs || '1' }}
          TOKENIZER: ${{ inputs.tokenizer || 'bpe' }}
          SEQUENCE_LENGTH: ${{ inputs.sequence_length || '1024' }}
          MAX_TOKENS: ${{ inputs.max_tokens || '200000000' }}
          MODEL_SIZE: ${{ inputs.model_size || 'tiny' }}
        run: |
          if [[ "$SEQUENCE_LENGTH" == "1024" ]]; then
            BASE_BATCH_SIZE=4
          else
            BASE_BATCH_SIZE=16
          fi
          python -m catai \
            --corpus data/corpus.txt \
            --checkpoint catai.pt \
            --resume-from catai-base-recovery.pt \
            --recovery-checkpoint catai-base-recovery.pt \
            --checkpoint-every-batches 50 \
            --epochs "$BASE_EPOCHS" \
            --batch-size "$BASE_BATCH_SIZE" \
            --sequence-length "$SEQUENCE_LENGTH" \
            --model-size "$MODEL_SIZE" \
            --tokenizer "$TOKENIZER" \
            --vocab-size 512 \
            --tokenizer-sample-chars 250000 \
            --max-tokens "$MAX_TOKENS" \
            --validation-split 0.05 \
            --minimum-tokens-per-parameter 20 \
            --device cpu \
            --max-batches-per-run-fraction 0.25

      - name: Upload base training recovery checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: catai-base-recovery2
          path: catai-base-recovery.pt
          retention-days: 7

  base_training3:
    if: github.event_name == 'workflow_dispatch' && inputs.training_mode == 'full'
    needs: [test, base_training2]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install CatAI and corpus tooling
        run: python -m pip install -e ".[data]"
      - name: Restore corpus cache
        id: corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: data/corpus.txt
          key: catai-corpus-curated-v3-${{ hashFiles('data/download_corpus.py') }}
      - name: Download real text corpus
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        run: python data/download_corpus.py --output data/corpus.txt --target-chars 1000000000 --fineweb-edu-chars 150000000
      - name: Save corpus cache
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/corpus.txt
          key: catai-corpus-curated-v3-${{ hashFiles('data/download_corpus.py') }}
      - name: Download base training recovery checkpoint
        uses: actions/download-artifact@v4
        with:
          name: catai-base-recovery2
          path: .
      - name: Resume base training (quarter 3 of 4)
        env:
          BASE_EPOCHS: ${{ inputs.base_epochs || '1' }}
          TOKENIZER: ${{ inputs.tokenizer || 'bpe' }}
          SEQUENCE_LENGTH: ${{ inputs.sequence_length || '1024' }}
          MAX_TOKENS: ${{ inputs.max_tokens || '200000000' }}
          MODEL_SIZE: ${{ inputs.model_size || 'tiny' }}
        run: |
          if [[ "$SEQUENCE_LENGTH" == "1024" ]]; then
            BASE_BATCH_SIZE=4
          else
            BASE_BATCH_SIZE=16
          fi
          python -m catai \
            --corpus data/corpus.txt \
            --checkpoint catai.pt \
            --resume-from catai-base-recovery.pt \
            --recovery-checkpoint catai-base-recovery.pt \
            --checkpoint-every-batches 50 \
            --epochs "$BASE_EPOCHS" \
            --batch-size "$BASE_BATCH_SIZE" \
            --sequence-length "$SEQUENCE_LENGTH" \
            --model-size "$MODEL_SIZE" \
            --tokenizer "$TOKENIZER" \
            --vocab-size 512 \
            --tokenizer-sample-chars 250000 \
            --max-tokens "$MAX_TOKENS" \
            --validation-split 0.05 \
            --minimum-tokens-per-parameter 20 \
            --device cpu \
            --max-batches-per-run-fraction 0.25

      - name: Upload base training recovery checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: catai-base-recovery3
          path: catai-base-recovery.pt
          retention-days: 7

  base_training4:
    if: github.event_name == 'workflow_dispatch' && inputs.training_mode == 'full'
    needs: [test, base_training3]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install CatAI and corpus tooling
        run: python -m pip install -e ".[data]"
      - name: Restore corpus cache
        id: corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: data/corpus.txt
          key: catai-corpus-curated-v3-${{ hashFiles('data/download_corpus.py') }}
      - name: Download real text corpus
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        run: python data/download_corpus.py --output data/corpus.txt --target-chars 1000000000 --fineweb-edu-chars 150000000
      - name: Save corpus cache
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/corpus.txt
          key: catai-corpus-curated-v3-${{ hashFiles('data/download_corpus.py') }}
      - name: Download base training recovery checkpoint
        uses: actions/download-artifact@v4
        with:
          name: catai-base-recovery3
          path: .
      - name: Finish base training (final quarter)
        env:
          BASE_EPOCHS: ${{ inputs.base_epochs || '1' }}
          TOKENIZER: ${{ inputs.tokenizer || 'bpe' }}
          SEQUENCE_LENGTH: ${{ inputs.sequence_length || '1024' }}
          MAX_TOKENS: ${{ inputs.max_tokens || '200000000' }}
          MODEL_SIZE: ${{ inputs.model_size || 'tiny' }}
        run: |
          if [[ "$SEQUENCE_LENGTH" == "1024" ]]; then
            BASE_BATCH_SIZE=4
          else
            BASE_BATCH_SIZE=16
          fi
          python -m catai \
            --corpus data/corpus.txt \
            --checkpoint catai.pt \
            --resume-from catai-base-recovery.pt \
            --recovery-checkpoint catai-base-recovery.pt \
            --checkpoint-every-batches 50 \
            --epochs "$BASE_EPOCHS" \
            --batch-size "$BASE_BATCH_SIZE" \
            --sequence-length "$SEQUENCE_LENGTH" \
            --model-size "$MODEL_SIZE" \
            --tokenizer "$TOKENIZER" \
            --vocab-size 512 \
            --tokenizer-sample-chars 250000 \
            --max-tokens "$MAX_TOKENS" \
            --validation-split 0.05 \
            --minimum-tokens-per-parameter 20 \
            --device cpu

      - name: Generate base text
        run: |
          python -m catai.generate_cli \
            --checkpoint catai.pt \
            --prompt "The cat" \
            --max-new-tokens 200 \
            --temperature 0.7 \
            --top-k 40 \
            --repetition-penalty 1.0 \
            --no-repeat-ngram-size 0 \
            --device cpu

      - name: Upload base checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: catai-base-checkpoint
          path: catai.pt
          retention-days: 7

  dataset_expansion:
    if: github.event_name == 'workflow_dispatch' && inputs.training_mode == 'datasets_only'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CatAI
        run: python -m pip install -e .
      - name: Prepare bounded samples from the expanded Hugging Face shortlist
        run: |
          python data/prepare_dataset_expansion.py \
            --max-examples-per-source 1000 \
            --seed 42
      - name: Validate generated chat and emotion records
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "src")
          from catai.chat_dataset import load_chat_dataset

          paths = (
              "data/expanded_chat.jsonl",
              "data/research_chat.jsonl",
              "data/expanded_emotion.jsonl",
          )
          for path in paths:
              if Path(path).stat().st_size == 0:
                  print(f"{path}: no usable examples were produced")
                  continue
              examples = load_chat_dataset(path)
              print(f"{path}: {len(examples):,} valid examples")
          PY
      - name: Upload expanded chat datasets
        uses: actions/upload-artifact@v4
        with:
          name: catai-expanded-chat-datasets
          path: data/expanded_chat.jsonl
          if-no-files-found: error
          retention-days: 14
      - name: Upload research-only chat datasets
        uses: actions/upload-artifact@v4
        with:
          name: catai-research-chat-datasets
          path: data/research_chat.jsonl
          if-no-files-found: error
          retention-days: 14
      - name: Upload expanded emotion datasets
        uses: actions/upload-artifact@v4
        with:
          name: catai-expanded-emotion-datasets
          path: data/expanded_emotion.jsonl
          if-no-files-found: error
          retention-days: 14
      - name: Upload dataset manifest
        uses: actions/upload-artifact@v4
        with:
          name: catai-expanded-dataset-manifest
          path: data/expanded_datasets_manifest.json
          if-no-files-found: error
          retention-days: 14

  emotion_go_emotions:
    if: github.event_name == 'workflow_dispatch' && inputs.training_mode == 'emotions_only'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GoEmotions reader
        run: python -m pip install --upgrade pip pyarrow
      - name: Prepare GoEmotions
        run: |
          python data/prepare_emotion_datasets.py \
            --source go_emotions \
            --output data/go_emotions_emotion.jsonl
      - name: Upload GoEmotions examples
        uses: actions/upload-artifact@v4
        with:
          name: catai-emotion-go-emotions
          path: data/go_emotions_emotion.jsonl
          retention-days: 7

  emotion_merge:
    if: github.event_name == 'workflow_dispatch' && inputs.training_mode == 'emotions_only'
    needs: [emotion_go_emotions]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: catai-emotion-go-emotions
          path: data
      - name: Merge the emotional datasets
        run: |
          python data/merge_emotion_datasets.py \
            --go-emotions data/go_emotions_emotion.jsonl \
            --output data/catai_emotion.jsonl \
            --seed 42
      - name: Validate the merged emotional dataset
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          from catai.chat_dataset import load_chat_dataset

          examples = load_chat_dataset("data/catai_emotion.jsonl")
          print(f"Validated {len(examples):,} emotion-aware examples")
          PY
      - name: Upload CatAI emotional dataset
        uses: actions/upload-artifact@v4
        with:
          name: catai-emotion-dataset
          path: data/catai_emotion.jsonl
          retention-days: 7


  extra_sft_data:
    if: github.event_name == 'workflow_dispatch' && (inputs.training_mode == 'full' || inputs.training_mode == 'sft_only')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare bounded Smol-SmolTalk sample
        run: |
          python data/prepare_extra_sft_datasets.py \
            --source smol-smoltalk \
            --output data/smol_smoltalk_chat.jsonl \
            --max-examples 2500 \
            --seed 42
      - name: Upload Smol-SmolTalk examples
        uses: actions/upload-artifact@v4
        with:
          name: catai-extra-smol-smoltalk
          path: data/smol_smoltalk_chat.jsonl
          retention-days: 7
      - name: Prepare bounded Blended Skill Talk sample
        run: |
          python data/prepare_extra_sft_datasets.py \
            --source blended-skill-talk \
            --output data/blended_skill_talk_chat.jsonl \
            --max-examples 1000 \
            --seed 42
      - name: Upload Blended Skill Talk examples
        uses: actions/upload-artifact@v4
        with:
          name: catai-extra-blended-skill-talk
          path: data/blended_skill_talk_chat.jsonl
          retention-days: 7
      - name: Prepare bounded MIT-licensed UltraChat sample
        run: |
          python data/prepare_extra_sft_datasets.py \
            --source ultrachat \
            --output data/ultrachat_200k_chat.jsonl \
            --max-examples 5000 \
            --seed 42
      - name: Upload UltraChat examples
        uses: actions/upload-artifact@v4
        with:
          name: catai-extra-ultrachat
          path: data/ultrachat_200k_chat.jsonl
          retention-days: 7

  sft:
    # In SFT-only mode, both base-training stages are intentionally skipped. Explicitly
    # allow this job to proceed when tests passed and a prior run is selected.
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      needs.test.result == 'success' &&
      (needs.base_training4.result == 'success' || inputs.training_mode == 'sft_only') &&
      needs.extra_sft_data.result == 'success'
    needs: [test, base_training4, extra_sft_data]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Validate SFT-only inputs
        if: inputs.training_mode == 'sft_only'
        shell: bash
        env:
          BASE_CHECKPOINT_RUN_ID: ${{ inputs.base_checkpoint_run_id }}
        run: |
          set -euo pipefail
          if [[ ! "$BASE_CHECKPOINT_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "SFT-only mode needs base_checkpoint_run_id: the Actions run ID that has the catai-base-checkpoint artifact." >&2
            exit 1
          fi
      - name: Verify B2 publishing configuration
        if: inputs.publish_model == true
        shell: bash
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_ENDPOINT_URL: ${{ secrets.B2_ENDPOINT_URL }}
          B2_REGION: ${{ secrets.B2_REGION }}
        run: |
          set -euo pipefail
          missing=()
          for name in B2_KEY_ID B2_APPLICATION_KEY B2_BUCKET_NAME B2_ENDPOINT_URL B2_REGION; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing GitHub Actions secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit

          endpoint = os.environ["B2_ENDPOINT_URL"].strip().strip(chr(34) + chr(39))
          if "://" not in endpoint:
              endpoint = "https://" + endpoint
          parsed = urlsplit(endpoint)
          if (
              parsed.scheme.lower() != "https"
              or not parsed.hostname
              or parsed.username
              or parsed.password
              or parsed.query
              or parsed.fragment
              or parsed.path not in ("", "/")
          ):
              raise SystemExit(
                  "Invalid B2_ENDPOINT_URL secret. Use the HTTPS S3 API base URL, "
                  "for example https://s3.us-east-005.backblazeb2.com. "
                  "The configured value was not printed."
              )
          print("B2 endpoint format validated (value hidden).")
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install CatAI
        run: python -m pip install -e .
      - name: Download base checkpoint from selected prior run
        if: inputs.training_mode == 'sft_only'
        uses: actions/download-artifact@v4
        with:
          name: catai-base-checkpoint
          path: .
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.base_checkpoint_run_id }}
      - name: Download base checkpoint from this run
        if: inputs.training_mode == 'full'
        uses: actions/download-artifact@v4
        with:
          name: catai-base-checkpoint
          path: .
      - name: Download Smol-SmolTalk examples
        uses: actions/download-artifact@v4
        with:
          name: catai-extra-smol-smoltalk
          path: data
      - name: Download Blended Skill Talk examples
        uses: actions/download-artifact@v4
        with:
          name: catai-extra-blended-skill-talk
          path: data
      - name: Download UltraChat examples
        uses: actions/download-artifact@v4
        with:
          name: catai-extra-ultrachat
          path: data
      - name: Restore OASST1 source cache
        id: oasst-cache
        uses: actions/cache/restore@v4
        with:
          path: data/oasst1_ready.trees.jsonl.gz
          key: catai-oasst1-ready-v1
      - name: Build OASST1 CatAI chat dataset
        run: |
          python data/download_oasst1.py \
            --source data/oasst1_ready.trees.jsonl.gz \
            --output data/oasst1_chat.jsonl \
            --language en \
            --min-assistant-chars 20 \
            --max-assistant-rank 1 \
            --max-depth 4 \
            --keep-source
      - name: Save OASST1 source cache
        if: steps.oasst-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/oasst1_ready.trees.jsonl.gz
          key: catai-oasst1-ready-v1
      - name: Restore OASST2 source cache
        id: oasst2-cache
        uses: actions/cache/restore@v4
        with:
          path: data/oasst2_ready.trees.jsonl.gz
          key: catai-oasst2-ready-v1
      - name: Build OASST2 CatAI chat dataset
        run: |
          python data/download_oasst2.py \
            --source data/oasst2_ready.trees.jsonl.gz \
            --output data/oasst2_chat.jsonl \
            --language en \
            --min-assistant-chars 20 \
            --max-assistant-rank 1 \
            --max-depth 4 \
            --keep-source
      - name: Save OASST2 source cache
        if: steps.oasst2-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/oasst2_ready.trees.jsonl.gz
          key: catai-oasst2-ready-v1
      - name: Merge and balance OASST1 + OASST2
        env:
          CHAT_EXAMPLES: ${{ inputs.chat_examples || '10000' }}
        run: |
          python data/merge_chat_datasets.py \
            --oasst1 data/oasst1_chat.jsonl \
            --oasst2 data/oasst2_chat.jsonl \
            --output data/oasst_chat.jsonl \
            --max-examples "$CHAT_EXAMPLES" \
            --seed 42
      - name: Validate OASST1 and CatAI instruction datasets before SFT
        env:
          SEQUENCE_LENGTH: ${{ inputs.sequence_length || '1024' }}
        run: |
          python - <<'PY'
          import os

          from catai.checkpoint import load_checkpoint_metadata
          from catai.chat_dataset import load_chat_dataset
          from catai.sft import ChatSupervisedDataset
          from catai.sft_cli import _load_tokenizer

          metadata = load_checkpoint_metadata("catai.pt")
          tokenizer = _load_tokenizer(metadata["tokenizer"])
          sequence_length = int(os.environ["SEQUENCE_LENGTH"])

          base_examples = load_chat_dataset("data/oasst_chat.jsonl")
          instruction_examples = load_chat_dataset("data/instruction_chat.jsonl")
          base_dataset = ChatSupervisedDataset(
              base_examples, tokenizer, sequence_length=sequence_length
          )
          instruction_dataset = ChatSupervisedDataset(
              instruction_examples, tokenizer, sequence_length=sequence_length
          )
          smol_examples = load_chat_dataset("data/smol_smoltalk_chat.jsonl")
          smol_dataset = ChatSupervisedDataset(
              smol_examples[: min(128, len(smol_examples))],
              tokenizer, sequence_length=sequence_length,
          )
          blended_examples = load_chat_dataset("data/blended_skill_talk_chat.jsonl")
          blended_dataset = ChatSupervisedDataset(
              blended_examples[: min(128, len(blended_examples))],
              tokenizer, sequence_length=sequence_length,
          )
          print(f"Smol-SmolTalk: {len(smol_examples):,} loaded; {len(smol_dataset):,} preflighted")
          print(f"Blended Skill Talk: {len(blended_examples):,} loaded; {len(blended_dataset):,} preflighted")
          print(
              f"Merged OpenAssistant: {len(base_examples):,} loaded, "
              f"{len(base_dataset):,} trainable, "
              f"{base_dataset.compacted_examples:,} compacted, "
              f"{base_dataset.skipped_overlength_examples:,} skipped"
          )
          print(
              f"CatAI instructions: {len(instruction_examples):,} loaded, "
              f"{len(instruction_dataset):,} trainable, "
              f"{instruction_dataset.compacted_examples:,} compacted, "
              f"{instruction_dataset.skipped_overlength_examples:,} skipped"
          )
          PY
      - name: Supervised fine-tuning (SFT, epochs 1–2)
        env:
          SFT_TOTAL_EPOCHS: ${{ inputs.sft_epochs || '3' }}
          SEQUENCE_LENGTH: ${{ inputs.sequence_length || '1024' }}
        run: |
          SFT_STAGE_EPOCHS="$SFT_TOTAL_EPOCHS"
          if (( SFT_STAGE_EPOCHS > 2 )); then SFT_STAGE_EPOCHS=2; fi
          python -m catai.sft_cli \
            --base-checkpoint catai.pt \
            --dataset data/oasst_chat.jsonl \
            --personality-dataset data/instruction_chat.jsonl \
            --personality-ratio 0.03 \
            --smol-smoltalk-dataset data/smol_smoltalk_chat.jsonl \
            --smol-smoltalk-ratio 0.10 \
            --blended-skill-talk-dataset data/blended_skill_talk_chat.jsonl \
            --blended-skill-talk-ratio 0.05 \
            --ultrachat-dataset data/ultrachat_200k_chat.jsonl \
            --ultrachat-ratio 0.25 \
            --samples-per-epoch 6000 \
            --max-validation-examples 500 \
            --checkpoint catai-sft.pt \
            --epochs "$SFT_STAGE_EPOCHS" \
            --batch-size 2 \
            --learning-rate 2e-5 \
            --minimum-tokens-per-parameter 20 \
            --grad-clip 1.0 \
            --validation-split 0.05 \
            --patience 2 \
            --sequence-length "$SEQUENCE_LENGTH" \
            --seed 42 \
            --device cpu \
            --recovery-checkpoint catai-sft-recovery.pt \
            --checkpoint-every-batches 50
      - name: Upload SFT recovery checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catai-sft-recovery
          path: catai-sft-recovery.pt
          if-no-files-found: ignore
          retention-days: 7

