name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      chat_examples:
        description: "Maximum OASST1 chat examples for SFT"
        required: false
        default: "5000"
      sft_epochs:
        description: "SFT epochs"
        required: false
        default: "2"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PIP_NO_CACHE_DIR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Disk usage before CatAI install
        run: |
          echo "=== Filesystem ==="
          df -h /
          echo
          echo "=== Relevant directories ==="
          du -sh "$HOME" "$GITHUB_WORKSPACE" "$RUNNER_TOOL_CACHE" "$RUNNER_TEMP" /tmp 2>/dev/null || true
          echo
          echo "=== pip cache ==="
          du -sh "$HOME/.cache/pip" 2>/dev/null || true
      - name: Install CatAI
        run: python -m pip install -e .
      - name: Disk usage after CatAI install
        run: |
          echo "=== Filesystem ==="
          df -h /
          echo
          echo "=== Relevant directories ==="
          du -sh "$HOME" "$GITHUB_WORKSPACE" "$RUNNER_TOOL_CACHE" "$RUNNER_TEMP" /tmp 2>/dev/null || true
          echo
          echo "=== pip cache ==="
          du -sh "$HOME/.cache/pip" 2>/dev/null || true
      - name: Run tests with disk monitor
        shell: bash
        run: |
          set -o pipefail

          python -m pytest -q &
          test_pid=$!

          (
            while kill -0 "$test_pid" 2>/dev/null; do
              echo
              echo "=== Disk monitor $(date -u '+%Y-%m-%d %H:%M:%S UTC') ==="
              df -h /
              echo "--- selected directories ---"
              du -sh /tmp "$HOME" "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$RUNNER_TOOL_CACHE" 2>/dev/null || true
              sleep 30
            done
          ) &
          monitor_pid=$!

          wait "$test_pid"
          test_status=$?

          kill "$monitor_pid" 2>/dev/null || true
          wait "$monitor_pid" 2>/dev/null || true

          exit "$test_status"

  generate:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Disk usage before CatAI install
        run: |
          echo "=== Filesystem ==="
          df -h /
          echo
          echo "=== Relevant directories ==="
          du -sh "$HOME" "$GITHUB_WORKSPACE" "$RUNNER_TOOL_CACHE" "$RUNNER_TEMP" 2>/dev/null || true
          echo
          echo "=== pip cache ==="
          du -sh "$HOME/.cache/pip" 2>/dev/null || true
      - name: Install CatAI
        run: python -m pip install -e .
      - name: Disk usage after CatAI install
        run: |
          echo "=== Filesystem ==="
          df -h /
          echo
          echo "=== Relevant directories ==="
          du -sh "$HOME" "$GITHUB_WORKSPACE" "$RUNNER_TOOL_CACHE" "$RUNNER_TEMP" 2>/dev/null || true
          echo
          echo "=== pip cache ==="
          du -sh "$HOME/.cache/pip" 2>/dev/null || true

      - name: Restore OASST1 source cache
        id: oasst-cache
        uses: actions/cache/restore@v4
        with:
          path: data/oasst1_ready.trees.jsonl.gz
          key: catai-oasst1-ready-v1
      - name: Build OASST1 CatAI chat dataset
        run: |
          python data/download_oasst1.py             --source data/oasst1_ready.trees.jsonl.gz             --output data/oasst1_chat.jsonl             --max-examples "${{ inputs.chat_examples || '5000' }}"             --keep-source

      - name: Merge CatAI personality examples
        run: cat data/instruction_chat.jsonl data/oasst1_chat.jsonl > data/chat_sft.jsonl

      - name: Validate chat dataset before base training
        run: |
          python - <<'PY'
          from catai.chat_dataset import load_chat_dataset
          from catai.sft import ChatSupervisedDataset
          from catai.tokenizer import CharTokenizer

          examples = load_chat_dataset("data/chat_sft.jsonl")
          dataset = ChatSupervisedDataset(
              examples,
              CharTokenizer.default(),
              sequence_length=256,
          )
          print(f"validated {len(examples):,} chat examples")
          print(f"preflight constructed {len(dataset):,} SFT examples")
          print(f"first message roles: {[message['role'] for message in examples[0]]}")
          print(f"last message roles: {[message['role'] for message in examples[-1]]}")
          PY

      - name: Save OASST1 source cache
        if: steps.oasst-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/oasst1_ready.trees.jsonl.gz
          key: catai-oasst1-ready-v1

      - name: Restore corpus cache
        id: corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: data/corpus.txt
          key: catai-corpus-redpajama-v2-100m-${{ hashFiles('data/download_corpus.py') }}
      - name: Download real text corpus
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        run: python data/download_corpus.py --output data/corpus.txt --target-chars 100000000
      - name: Save corpus cache
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/corpus.txt
          key: catai-corpus-redpajama-v2-100m-${{ hashFiles('data/download_corpus.py') }}

      - name: Train base model
        run: |
          python -m catai             --corpus data/corpus.txt             --checkpoint catai.pt             --epochs 1             --batch-size 16             --sequence-length 256             --model-size base             --max-tokens 10000000             --validation-split 0.05             --device cpu

      - name: Generate base text
        run: |
          python -m catai.generate_cli             --checkpoint catai.pt             --prompt "The cat"             --max-new-tokens 200             --temperature 0.7             --top-k 40             --repetition-penalty 1.1             --no-repeat-ngram-size 3             --device cpu

      - name: Supervised fine-tuning (SFT)
        run: |
          python -m catai.sft_cli             --base-checkpoint catai.pt             --dataset data/chat_sft.jsonl             --checkpoint catai-sft.pt             --epochs "${{ inputs.sft_epochs || '2' }}"             --batch-size 16             --learning-rate 2e-5             --grad-clip 1.0             --validation-split 0.05             --patience 2             --sequence-length 256             --seed 42             --device cpu

      - name: Generate chat response
        run: |
          python -m catai.generate_cli \
            --checkpoint catai-sft.pt \
            --prompt <|system|>\\nYou are CatAI, a friendly cat-themed conversational AI. Be helpful, clear, concise, and playful when appropriate.\\n<|user|>\\nHello!\\n<|assistant|>\\n' \
            --max-new-tokens 160 \
            --temperature 0.8 \
            --top-k 40 \
            --repetition-penalty 1.1 \
            --no-repeat-ngram-size 3 \
            --device cpu
