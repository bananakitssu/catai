name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      chat_examples:
        description: "Maximum OASST1 chat examples for SFT"
        required: false
        default: "4500"
      sft_epochs:
        description: "SFT epochs"
        required: false
        default: "3"
      base_epochs:
        description: "Base-model pretraining epochs"
        required: false
        default: "1"
      tokenizer:
        description: "Tokenizer for a fresh base-model experiment"
        type: choice
        options:
          - bpe
          - char
        required: true
        default: bpe
      sequence_length:
        description: "Base and SFT sequence length"
        type: choice
        options:
          - "512"
          - "1024"
        required: true
        default: "512"
      max_tokens:
        description: "Base pretraining token budget; start at 5M for a measured BPE experiment"
        required: false
        default: "5000000"
      publish_model:
        description: "Publish this experiment to the live B2 model manifest"
        type: boolean
        required: true
        default: false
      training_mode:
        description: "Full retraining or reuse a prior base checkpoint for SFT-only iteration"
        type: choice
        options:
          - full
          - sft_only
        required: true
        default: full
      base_checkpoint_run_id:
        description: "For sft_only: Actions run ID containing the catai-base-checkpoint artifact"
        required: false
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PIP_NO_CACHE_DIR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest 'boto3>=1.34,<2'
      - name: Disk usage before CatAI install
        run: |
          echo "=== Filesystem ==="
          df -h /
          echo
          echo "=== Relevant directories ==="
          du -sh "$HOME" "$GITHUB_WORKSPACE" "$RUNNER_TOOL_CACHE" "$RUNNER_TEMP" /tmp 2>/dev/null || true
          echo
          echo "=== pip cache ==="
          du -sh "$HOME/.cache/pip" 2>/dev/null || true
      - name: Install CatAI
        run: python -m pip install -e .
      - name: Disk usage after CatAI install
        run: |
          echo "=== Filesystem ==="
          df -h /
          echo
          echo "=== Relevant directories ==="
          du -sh "$HOME" "$GITHUB_WORKSPACE" "$RUNNER_TOOL_CACHE" "$RUNNER_TEMP" /tmp 2>/dev/null || true
          echo
          echo "=== pip cache ==="
          du -sh "$HOME/.cache/pip" 2>/dev/null || true
      - name: Validate training inputs
        if: github.event_name == 'workflow_dispatch'
        env:
          BASE_EPOCHS: ${{ inputs.base_epochs || '1' }}
          SFT_EPOCHS: ${{ inputs.sft_epochs || '1' }}
          CHAT_EXAMPLES: ${{ inputs.chat_examples || '4500' }}
          MAX_TOKENS: ${{ inputs.max_tokens || '5000000' }}
          TOKENIZER: ${{ inputs.tokenizer || 'bpe' }}
          SEQUENCE_LENGTH: ${{ inputs.sequence_length || '512' }}
        run: |
          python - <<'PY'
          import os

          def positive_int(name, maximum):
              value = os.environ[name]
              if not value.isdecimal():
                  raise SystemExit(f"{name} must be a positive integer")
              number = int(value)
              if number < 1 or number > maximum:
                  raise SystemExit(f"{name} must be between 1 and {maximum}")
              return number

          positive_int("BASE_EPOCHS", 5)
          positive_int("SFT_EPOCHS", 10)
          positive_int("CHAT_EXAMPLES", 50000)
          positive_int("MAX_TOKENS", 100000000)
          if os.environ["TOKENIZER"] not in {"bpe", "char"}:
              raise SystemExit("TOKENIZER must be 'bpe' or 'char'")
          if os.environ["SEQUENCE_LENGTH"] not in {"512", "1024"}:
              raise SystemExit("SEQUENCE_LENGTH must be 512 or 1024")
          if os.environ["TOKENIZER"] == "char" and os.environ["SEQUENCE_LENGTH"] != "1024":
              raise SystemExit(
                  "The character tokenizer needs a 1024-token context for CatAI's "
                  "state prompt; use BPE for the 512-token experiment."
              )
          print("Experiment inputs validated.")
          PY
      - name: Compile CatAI Python sources
        run: python -m compileall -q inference scripts tests

      - name: Run tests with disk monitor
        shell: bash
        run: |
          set -o pipefail

          python -m pytest -q &
          test_pid=$!

          (
            while kill -0 "$test_pid" 2>/dev/null; do
              echo
              echo "=== Disk monitor $(date -u '+%Y-%m-%d %H:%M:%S UTC') ==="
              df -h /
              echo "--- selected directories ---"
              du -sh /tmp "$HOME" "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$RUNNER_TOOL_CACHE" 2>/dev/null || true
              sleep 30
            done
          ) &
          monitor_pid=$!

          wait "$test_pid"
          test_status=$?

          kill "$monitor_pid" 2>/dev/null || true
          wait "$monitor_pid" 2>/dev/null || true

          exit "$test_status"

  base_training:
    if: github.event_name == 'workflow_dispatch' && inputs.training_mode == 'full'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Verify B2 publisher secrets before expensive training
        if: inputs.publish_model == true
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_ENDPOINT_URL: ${{ secrets.B2_ENDPOINT_URL }}
          B2_REGION: ${{ secrets.B2_REGION }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in B2_KEY_ID B2_APPLICATION_KEY B2_BUCKET_NAME B2_ENDPOINT_URL B2_REGION; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing GitHub Actions secrets: %s\n' "${missing[*]}" >&2
            echo 'Add the B2 secrets listed in inference/README.md before starting a full training run.' >&2
            exit 1
          fi
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit

          endpoint = os.environ["B2_ENDPOINT_URL"].strip().strip(chr(34) + chr(39))
          if "://" not in endpoint:
              endpoint = "https://" + endpoint
          parsed = urlsplit(endpoint)
          if (
              parsed.scheme.lower() != "https"
              or not parsed.hostname
              or parsed.username
              or parsed.password
              or parsed.query
              or parsed.fragment
              or parsed.path not in ("", "/")
          ):
              raise SystemExit(
                  "Invalid B2_ENDPOINT_URL secret. Set it to the HTTPS S3 API base URL, "
                  "for example https://s3.us-east-005.backblazeb2.com. "
                  "The configured value was not printed."
              )
          print("B2 endpoint format validated (value hidden).")
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Disk usage before CatAI install
        run: |
          echo "=== Filesystem ==="
          df -h /
          echo
          echo "=== Relevant directories ==="
          du -sh "$HOME" "$GITHUB_WORKSPACE" "$RUNNER_TOOL_CACHE" "$RUNNER_TEMP" 2>/dev/null || true
          echo
          echo "=== pip cache ==="
          du -sh "$HOME/.cache/pip" 2>/dev/null || true
      - name: Install CatAI
        run: python -m pip install -e .
      - name: Disk usage after CatAI install
        run: |
          echo "=== Filesystem ==="
          df -h /
          echo
          echo "=== Relevant directories ==="
          du -sh "$HOME" "$GITHUB_WORKSPACE" "$RUNNER_TOOL_CACHE" "$RUNNER_TEMP" 2>/dev/null || true
          echo
          echo "=== pip cache ==="
          du -sh "$HOME/.cache/pip" 2>/dev/null || true

      - name: Check reused checkpoint settings
        if: inputs.training_mode == 'sft_only'
        env:
          EXPECTED_TOKENIZER: ${{ inputs.tokenizer }}
          EXPECTED_SEQUENCE_LENGTH: ${{ inputs.sequence_length }}
        run: |
          python - <<'PY'
          import os
          from catai.checkpoint import load_checkpoint_metadata

          metadata = load_checkpoint_metadata("catai.pt")
          tokenizer = metadata.get("tokenizer", {})
          model = metadata.get("model", {})
          expected_tokenizer = os.environ["EXPECTED_TOKENIZER"]
          expected_length = int(os.environ["EXPECTED_SEQUENCE_LENGTH"])

          if tokenizer.get("type") != expected_tokenizer:
              raise SystemExit(
                  f"Selected base checkpoint uses tokenizer={tokenizer.get('type')!r}; "
                  f"the workflow requested {expected_tokenizer!r}."
              )
          if model.get("max_seq_len") != expected_length:
              raise SystemExit(
                  f"Selected base checkpoint uses context length={model.get('max_seq_len')!r}; "
                  f"the workflow requested {expected_length}."
              )
          print("Reused checkpoint tokenizer and context match the selected experiment.")
          PY
      - name: Restore OASST1 source cache
        id: oasst-cache
        uses: actions/cache/restore@v4
        with:
          path: data/oasst1_ready.trees.jsonl.gz
          key: catai-oasst1-ready-v1
      - name: Build OASST1 CatAI chat dataset
        env:
          CHAT_EXAMPLES: ${{ inputs.chat_examples || '4500' }}
        run: |
          python data/download_oasst1.py \
            --source data/oasst1_ready.trees.jsonl.gz \
            --output data/oasst1_chat.jsonl \
            --language en \
            --min-assistant-chars 20 \
            --max-assistant-rank 1 \
            --max-depth 4 \
            --max-examples "$CHAT_EXAMPLES" \
            --keep-source

      - name: Validate OASST1 and CatAI personality datasets
        run: |
          python - <<'PY'
          from catai.chat_dataset import load_chat_dataset
          from catai.sft import ChatSupervisedDataset
          from catai.tokenizer import CharTokenizer

          base_examples = load_chat_dataset("data/oasst1_chat.jsonl")
          personality_examples = load_chat_dataset("data/instruction_chat.jsonl")
          examples = base_examples + personality_examples
          dataset = ChatSupervisedDataset(
              examples,
              CharTokenizer.default(),
              sequence_length=1024,
          )
          print(f"validated {len(base_examples):,} OASST1 examples")
          print(f"validated {len(personality_examples):,} personality examples")
          print(f"preflight constructed {len(dataset):,} SFT examples")
          PY

      - name: Save OASST1 source cache
        if: steps.oasst-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/oasst1_ready.trees.jsonl.gz
          key: catai-oasst1-ready-v1

      - name: Restore corpus cache
        id: corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: data/corpus.txt
          key: catai-corpus-redpajama-v2-100m-${{ hashFiles('data/download_corpus.py') }}
      - name: Download real text corpus
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        run: python data/download_corpus.py --output data/corpus.txt --target-chars 100000000
      - name: Save corpus cache
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/corpus.txt
          key: catai-corpus-redpajama-v2-100m-${{ hashFiles('data/download_corpus.py') }}

      - name: Train base model
        env:
          BASE_EPOCHS: ${{ inputs.base_epochs || '1' }}
          TOKENIZER: ${{ inputs.tokenizer || 'bpe' }}
          SEQUENCE_LENGTH: ${{ inputs.sequence_length || '512' }}
          MAX_TOKENS: ${{ inputs.max_tokens || '5000000' }}
        run: |
          python -m catai \
            --corpus data/corpus.txt \
            --checkpoint catai.pt \
            --epochs "$BASE_EPOCHS" \
            --batch-size 16 \
            --sequence-length "$SEQUENCE_LENGTH" \
            --model-size base \
            --tokenizer "$TOKENIZER" \
            --vocab-size 512 \
            --tokenizer-sample-chars 250000 \
            --max-tokens "$MAX_TOKENS" \
            --validation-split 0.05 \
            --device cpu

      - name: Generate base text
        run: |
          python -m catai.generate_cli             --checkpoint catai.pt             --prompt "The cat"             --max-new-tokens 200             --temperature 0.7             --top-k 40             --repetition-penalty 1.0             --no-repeat-ngram-size 0             --device cpu

      - name: Upload base checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: catai-base-checkpoint
          path: catai.pt
          retention-days: 7

  sft:
    # In SFT-only mode, base_training is intentionally skipped. Explicitly
    # allow this job to proceed when tests passed and a prior run is selected.
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      needs.test.result == 'success' &&
      needs.sft.result == 'success' &&
      (needs.base_training.result == 'success' || inputs.training_mode == 'sft_only')
    needs: [test, base_training]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Validate SFT-only inputs
        if: inputs.training_mode == 'sft_only'
        shell: bash
        env:
          BASE_CHECKPOINT_RUN_ID: ${{ inputs.base_checkpoint_run_id }}
        run: |
          set -euo pipefail
          if [[ ! "$BASE_CHECKPOINT_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "SFT-only mode needs base_checkpoint_run_id: the Actions run ID that has the catai-base-checkpoint artifact." >&2
            exit 1
          fi
      - name: Verify B2 publishing configuration
        if: inputs.publish_model == true
        shell: bash
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_ENDPOINT_URL: ${{ secrets.B2_ENDPOINT_URL }}
          B2_REGION: ${{ secrets.B2_REGION }}
        run: |
          set -euo pipefail
          missing=()
          for name in B2_KEY_ID B2_APPLICATION_KEY B2_BUCKET_NAME B2_ENDPOINT_URL B2_REGION; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing GitHub Actions secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit

          endpoint = os.environ["B2_ENDPOINT_URL"].strip().strip(chr(34) + chr(39))
          if "://" not in endpoint:
              endpoint = "https://" + endpoint
          parsed = urlsplit(endpoint)
          if (
              parsed.scheme.lower() != "https"
              or not parsed.hostname
              or parsed.username
              or parsed.password
              or parsed.query
              or parsed.fragment
              or parsed.path not in ("", "/")
          ):
              raise SystemExit(
                  "Invalid B2_ENDPOINT_URL secret. Use the HTTPS S3 API base URL, "
                  "for example https://s3.us-east-005.backblazeb2.com. "
                  "The configured value was not printed."
              )
          print("B2 endpoint format validated (value hidden).")
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install CatAI
        run: python -m pip install -e .
      - name: Download base checkpoint from selected prior run
        if: inputs.training_mode == 'sft_only'
        uses: actions/download-artifact@v4
        with:
          name: catai-base-checkpoint
          path: .
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.base_checkpoint_run_id }}
      - name: Download base checkpoint from this run
        if: inputs.training_mode == 'full'
        uses: actions/download-artifact@v4
        with:
          name: catai-base-checkpoint
          path: .
      - name: Restore OASST1 source cache
        id: oasst-cache
        uses: actions/cache/restore@v4
        with:
          path: data/oasst1_ready.trees.jsonl.gz
          key: catai-oasst1-ready-v1
      - name: Build OASST1 CatAI chat dataset
        env:
          CHAT_EXAMPLES: ${{ inputs.chat_examples || '4500' }}
        run: |
          python data/download_oasst1.py \
            --source data/oasst1_ready.trees.jsonl.gz \
            --output data/oasst1_chat.jsonl \
            --language en \
            --min-assistant-chars 20 \
            --max-assistant-rank 1 \
            --max-depth 4 \
            --max-examples "$CHAT_EXAMPLES" \
            --keep-source
      - name: Validate OASST1 and CatAI instruction datasets before SFT
        env:
          SEQUENCE_LENGTH: ${{ inputs.sequence_length || '512' }}
        run: |
          python - <<'PY'
          import os

          from catai.checkpoint import load_checkpoint_metadata
          from catai.chat_dataset import load_chat_dataset
          from catai.sft import ChatSupervisedDataset
          from catai.sft_cli import _load_tokenizer

          metadata = load_checkpoint_metadata("catai.pt")
          tokenizer = _load_tokenizer(metadata["tokenizer"])
          sequence_length = int(os.environ["SEQUENCE_LENGTH"])

          base_examples = load_chat_dataset("data/oasst1_chat.jsonl")
          instruction_examples = load_chat_dataset("data/instruction_chat.jsonl")
          base_dataset = ChatSupervisedDataset(
              base_examples, tokenizer, sequence_length=sequence_length
          )
          instruction_dataset = ChatSupervisedDataset(
              instruction_examples, tokenizer, sequence_length=sequence_length
          )
          print(
              f"OASST1: {len(base_examples):,} loaded, "
              f"{len(base_dataset):,} trainable, "
              f"{base_dataset.compacted_examples:,} compacted, "
              f"{base_dataset.skipped_overlength_examples:,} skipped"
          )
          print(
              f"CatAI instructions: {len(instruction_examples):,} loaded, "
              f"{len(instruction_dataset):,} trainable, "
              f"{instruction_dataset.compacted_examples:,} compacted, "
              f"{instruction_dataset.skipped_overlength_examples:,} skipped"
          )
          PY
      - name: Supervised fine-tuning (SFT, epochs 1–2)
        env:
          SFT_TOTAL_EPOCHS: ${{ inputs.sft_epochs || '3' }}
          SEQUENCE_LENGTH: ${{ inputs.sequence_length || '512' }}
        run: |
          python -m catai.sft_cli \
            --base-checkpoint catai.pt \
            --dataset data/oasst1_chat.jsonl \
            --personality-dataset data/instruction_chat.jsonl \
            --personality-ratio 0.25 \
            --checkpoint catai-sft.pt \
            --epochs "$SFT_EPOCHS" \
            --batch-size 2 \
            --learning-rate 2e-5 \
            --grad-clip 1.0 \
            --validation-split 0.05 \
            --patience 2 \
            --sequence-length "$SEQUENCE_LENGTH" \
            --seed 42 \
            --device cpu \
            --recovery-checkpoint catai-sft-recovery.pt \
            --checkpoint-every-batches 50
      - name: Upload SFT recovery checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catai-sft-recovery
          path: catai-sft-recovery.pt
          if-no-files-found: ignore
          retention-days: 7

  sft2:
    # In SFT-only mode, base_training is intentionally skipped. Explicitly
    # allow this job to proceed when tests passed and a prior run is selected.
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      needs.test.result == 'success' &&
      needs.sft.result == 'success' &&
      (needs.base_training.result == 'success' || inputs.training_mode == 'sft_only')
    needs: [test, base_training, sft]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Validate SFT-only inputs
        if: inputs.training_mode == 'sft_only'
        shell: bash
        env:
          BASE_CHECKPOINT_RUN_ID: ${{ inputs.base_checkpoint_run_id }}
        run: |
          set -euo pipefail
          if [[ ! "$BASE_CHECKPOINT_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "SFT-only mode needs base_checkpoint_run_id: the Actions run ID that has the catai-base-checkpoint artifact." >&2
            exit 1
          fi
      - name: Verify B2 publishing configuration
        if: inputs.publish_model == true
        shell: bash
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_ENDPOINT_URL: ${{ secrets.B2_ENDPOINT_URL }}
          B2_REGION: ${{ secrets.B2_REGION }}
        run: |
          set -euo pipefail
          missing=()
          for name in B2_KEY_ID B2_APPLICATION_KEY B2_BUCKET_NAME B2_ENDPOINT_URL B2_REGION; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing GitHub Actions secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit

          endpoint = os.environ["B2_ENDPOINT_URL"].strip().strip(chr(34) + chr(39))
          if "://" not in endpoint:
              endpoint = "https://" + endpoint
          parsed = urlsplit(endpoint)
          if (
              parsed.scheme.lower() != "https"
              or not parsed.hostname
              or parsed.username
              or parsed.password
              or parsed.query
              or parsed.fragment
              or parsed.path not in ("", "/")
          ):
              raise SystemExit(
                  "Invalid B2_ENDPOINT_URL secret. Use the HTTPS S3 API base URL, "
                  "for example https://s3.us-east-005.backblazeb2.com. "
                  "The configured value was not printed."
              )
          print("B2 endpoint format validated (value hidden).")
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install CatAI
        run: python -m pip install -e .
      - name: Download base checkpoint from selected prior run
        if: inputs.training_mode == 'sft_only'
        uses: actions/download-artifact@v4
        with:
          name: catai-base-checkpoint
          path: .
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.base_checkpoint_run_id }}
      - name: Download base checkpoint from this run
        if: inputs.training_mode == 'full'
        uses: actions/download-artifact@v4
        with:
          name: catai-base-checkpoint
          path: .
      - name: Download SFT recovery checkpoint
        uses: actions/download-artifact@v4
        with:
          name: catai-sft-recovery
          path: .
      - name: Restore OASST1 source cache
        id: oasst-cache
        uses: actions/cache/restore@v4
        with:
          path: data/oasst1_ready.trees.jsonl.gz
          key: catai-oasst1-ready-v1
      - name: Build OASST1 CatAI chat dataset
        env:
          CHAT_EXAMPLES: ${{ inputs.chat_examples || '4500' }}
        run: |
          python data/download_oasst1.py \
            --source data/oasst1_ready.trees.jsonl.gz \
            --output data/oasst1_chat.jsonl \
            --language en \
            --min-assistant-chars 20 \
            --max-assistant-rank 1 \
            --max-depth 4 \
            --max-examples "$CHAT_EXAMPLES" \
            --keep-source
      - name: Validate OASST1 and CatAI instruction datasets before SFT
        env:
          SEQUENCE_LENGTH: ${{ inputs.sequence_length || '512' }}
        run: |
          python - <<'PY'
          import os

          from catai.checkpoint import load_checkpoint_metadata
          from catai.chat_dataset import load_chat_dataset
          from catai.sft import ChatSupervisedDataset
          from catai.sft_cli import _load_tokenizer

          metadata = load_checkpoint_metadata("catai.pt")
          tokenizer = _load_tokenizer(metadata["tokenizer"])
          sequence_length = int(os.environ["SEQUENCE_LENGTH"])

          base_examples = load_chat_dataset("data/oasst1_chat.jsonl")
          instruction_examples = load_chat_dataset("data/instruction_chat.jsonl")
          base_dataset = ChatSupervisedDataset(
              base_examples, tokenizer, sequence_length=sequence_length
          )
          instruction_dataset = ChatSupervisedDataset(
              instruction_examples, tokenizer, sequence_length=sequence_length
          )
          print(
              f"OASST1: {len(base_examples):,} loaded, "
              f"{len(base_dataset):,} trainable, "
              f"{base_dataset.compacted_examples:,} compacted, "
              f"{base_dataset.skipped_overlength_examples:,} skipped"
          )
          print(
              f"CatAI instructions: {len(instruction_examples):,} loaded, "
              f"{len(instruction_dataset):,} trainable, "
              f"{instruction_dataset.compacted_examples:,} compacted, "
              f"{instruction_dataset.skipped_overlength_examples:,} skipped"
          )
          PY
      - name: Supervised fine-tuning (SFT 2, epoch 3 + evaluation)
        env:
          SFT_EPOCHS: ${{ inputs.sft_epochs || '3' }}
          SEQUENCE_LENGTH: ${{ inputs.sequence_length || '512' }}
        run: |
          python -m catai.sft_cli \
            --base-checkpoint catai.pt \
            --dataset data/oasst1_chat.jsonl \
            --personality-dataset data/instruction_chat.jsonl \
            --personality-ratio 0.25 \
            --checkpoint catai-sft.pt \
            --resume-from catai-sft-recovery.pt \
            --recovery-checkpoint catai-sft-recovery.pt \
            --checkpoint-every-batches 50 \
            --epochs "$SFT_EPOCHS" \
            --batch-size 2 \
            --learning-rate 2e-5 \
            --grad-clip 1.0 \
            --validation-split 0.05 \
            --patience 2 \
            --sequence-length "$SEQUENCE_LENGTH" \
            --seed 42 \
            --device cpu
      - name: Evaluate chat responses
        run: python scripts/evaluate_chat.py --checkpoint catai-sft.pt --max-new-tokens 80 --temperature 0.65 --top-k 30 --repetition-penalty 1.05 --no-repeat-ngram-size 3 --device cpu

      - name: Export inference-only NumPy bundle
        run: python scripts/export_inference.py --checkpoint catai-sft.pt --output catai-sft.npz

      - name: Publish checkpoints to Backblaze B2
        if: inputs.publish_model == true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_ENDPOINT_URL: ${{ secrets.B2_ENDPOINT_URL }}
          B2_REGION: ${{ secrets.B2_REGION }}
          MODEL_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir 'boto3>=1.34,<2'
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urlsplit

          import boto3
          from botocore.config import Config

          bucket = os.environ["B2_BUCKET_NAME"]
          # Accept a bare B2 S3 hostname as well as a full URL, and remove
          # accidental surrounding whitespace/quotes from copied secret values.
          raw_endpoint = os.environ["B2_ENDPOINT_URL"].strip().strip(chr(34) + chr(39))
          if "://" not in raw_endpoint:
              raw_endpoint = "https://" + raw_endpoint
          parsed_endpoint = urlsplit(raw_endpoint)
          if (
              parsed_endpoint.scheme.lower() != "https"
              or not parsed_endpoint.hostname
              or parsed_endpoint.username
              or parsed_endpoint.password
              or parsed_endpoint.query
              or parsed_endpoint.fragment
              or parsed_endpoint.path not in ("", "/")
          ):
              raise SystemExit(
                  "Invalid B2_ENDPOINT_URL secret. Use the HTTPS S3 API base URL, "
                  "for example https://s3.us-east-005.backblazeb2.com. "
                  "The configured value was not printed."
              )
          endpoint = f"https://{parsed_endpoint.netloc}"
          region = os.environ["B2_REGION"]
          client = boto3.client(
              "s3",
              endpoint_url=endpoint,
              region_name=region,
              aws_access_key_id=os.environ["AWS_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["AWS_SECRET_ACCESS_KEY"],
              config=Config(signature_version="s3v4", s3={"addressing_style": "path"}),
          )

          # Keep the original training checkpoint for future fine-tuning.
          source = Path("catai-sft.pt")
          source_key = "ai/models/catai-sft.pt"
          client.upload_file(
              str(source), bucket, source_key,
              ExtraArgs={"ContentType": "application/octet-stream"},
          )
          source_head = client.head_object(Bucket=bucket, Key=source_key)
          if source_head["ContentLength"] != source.stat().st_size:
              raise SystemExit("B2 source checkpoint upload size verification failed")

          # Publish each inference bundle under an immutable versioned key.
          bundle = Path("catai-sft.npz")
          digest = hashlib.sha256()
          with bundle.open("rb") as stream:
              for chunk in iter(lambda: stream.read(4 * 1024 * 1024), b""):
                  digest.update(chunk)
          sha256 = digest.hexdigest()
          revision = os.environ["MODEL_REVISION"]
          model_key = f"ai/models/releases/{revision}/catai-sft.npz"
          client.upload_file(
              str(bundle), bucket, model_key,
              ExtraArgs={"ContentType": "application/octet-stream"},
          )
          head = client.head_object(Bucket=bucket, Key=model_key)
          if head["ContentLength"] != bundle.stat().st_size:
              raise SystemExit("B2 inference bundle upload size verification failed")
          remote = client.get_object(Bucket=bucket, Key=model_key)
          remote_digest = hashlib.sha256()
          remote_size = 0
          for chunk in iter(lambda: remote["Body"].read(4 * 1024 * 1024), b""):
              remote_digest.update(chunk)
              remote_size += len(chunk)
          if remote_size != bundle.stat().st_size or remote_digest.hexdigest() != sha256:
              raise SystemExit("B2 inference bundle remote SHA-256 verification failed")

          # The active manifest is the final write: a failed upload never makes
          # an incomplete artifact the live model.
          manifest = {
              "format": "catai-active-model",
              "format_version": 1,
              "object_key": model_key,
              "sha256": sha256,
              "bytes": bundle.stat().st_size,
              "revision": revision,
              "source_checkpoint_key": source_key,
              "published_at": datetime.now(timezone.utc).isoformat(),
          }
          client.put_object(
              Bucket=bucket,
              Key="ai/models/current.json",
              Body=json.dumps(manifest, separators=(",", ":")).encode("utf-8"),
              ContentType="application/json",
              CacheControl="no-store",
          )
          verified = client.get_object(Bucket=bucket, Key="ai/models/current.json")
          round_trip = json.loads(verified["Body"].read().decode("utf-8"))
          if round_trip.get("sha256") != sha256 or round_trip.get("object_key") != model_key:
              raise SystemExit("B2 active model manifest verification failed")
          print(f"Published source checkpoint: s3://{bucket}/{source_key} ({source.stat().st_size:,} bytes)")
          print(f"Published inference model: s3://{bucket}/{model_key} ({bundle.stat().st_size:,} bytes)")
          print("Verified and activated the new CatAI model manifest.")
          PY

      - name: Preserve trained checkpoint as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: catai-sft-checkpoint
          path: catai-sft.pt
          retention-days: 7
