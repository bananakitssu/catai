name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Install CatAI
        run: python -m pip install -e .
      - name: Run tests
        run: python -m pytest -q

  generate:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CatAI
        run: python -m pip install -e .
      - name: Train tiny model
        run: |
          python -m catai \
            --corpus data/tiny.txt \
            --checkpoint catai.pt \
            --epochs 1 \
            --batch-size 8 \
            --sequence-length 16 \
            --d-model 16 \
            --heads 2 \
            --layers 1 \
            --device cpu
      - name: Generate text
        run: |
          python -m catai.generate_cli \
            --checkpoint catai.pt \
            --prompt "Cats" \
            --max-new-tokens 50 \
            --temperature 0.8 \
            --device cpu
