      - name: Upload base training recovery checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: catai-base-recovery126
          path: catai-base-recovery.pt
          retention-days: 7
  base_training127:
    if: github.event_name == 'workflow_dispatch' && inputs.training_mode == 'full'
    needs: [test, base_training126]
    runs-on: ubuntu-latest
